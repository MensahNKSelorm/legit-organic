<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ action_name }} · Legit Organic</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f8f4e9;
      font-family: Arial,sans-serif;
    }
    .panel {
      width: min(36rem,calc(100% - 2rem));
      background: #0d3b2a;
      border-top: 6px solid #d85b48;
      padding: 3rem;
      box-sizing: border-box;
    }
    h1 {
      font-family: Georgia,serif;
      font-size: 2.7rem;
      font-weight: 400;
      margin: .3rem 0 1rem;
    }
    p {
      color: #d7e5d9;
      line-height: 1.6;
    }
    .warning,.error {
      color: #ffcbc2;
    }
    input,textarea,button,a {
      width: 100%;
      box-sizing: border-box;
      padding: 1rem;
      margin-top: 1rem;
      border: 1px solid #6d8778;
      background: #173b2b;
      color: white;
      font: inherit;
    }
    button,a {
      display: block;
      border: 0;
      background: #d85b48;
      color: white;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="panel">
    {% if complete %}
      <h1>{{ action_name }} complete.</h1>
      <p>{{ target_label }}</p>
      <a href="/admin/">Return to dashboard</a>
    {% else %}
      <h1>{{ action_name }}</h1>
      <p>{{ target_label }}</p>
      <p class="warning">{{ warning }}</p>
      <form method="post">
        {% csrf_token %}
        <label>Reason</label><textarea name="reason" required></textarea>
        <label>Your current password</label><input type="password" name="current_password" required>
        <label>Your authenticator or recovery code</label><input name="otp_token" autocomplete="one-time-code" required>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <button type="submit">Confirm {{ action_name|lower }}</button>
      </form>
    {% endif %}
  </main>
</body>
</html>
