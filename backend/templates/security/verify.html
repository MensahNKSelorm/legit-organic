<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify sign-in · Legit Organic</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#f8f4e9;font-family:Arial,sans-serif}.panel{width:min(30rem,calc(100% - 2rem));background:#0d3b2a;border-top:6px solid #f4c430;padding:clamp(1.5rem,5vw,3.5rem);box-sizing:border-box}h1{font-family:Georgia,serif;font-size:3rem;font-weight:400;margin:.3rem 0 1rem}p{color:#d7e5d9;line-height:1.6}input,button{width:100%;box-sizing:border-box;padding:1rem;margin-top:1rem;border:1px solid #6d8778;background:#173b2b;color:white;font:inherit}button{border:0;background:#f4c430;color:#0d3b2a;font-weight:800;cursor:pointer}.error{color:#ffb4ab}.small{font-size:.8rem;color:#aebcaf}</style></head><body><main class="panel"><p class="small">SECOND STEP</p><h1>Verify it’s you.</h1><p>Enter the current authenticator code or one recovery code.</p><form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="token">Security code</label><input id="token" name="token" autocomplete="one-time-code" required autofocus>{% if error %}<p class="error">{{ error }}</p>{% endif %}<button type="submit">Continue</button></form></main></body></html>
