{% extends "admin/change_list.html" %}

{% block content %}
  <section style="margin:0 0 24px;border:1px solid #304c3d;background:#102d22;color:#f8f4e9;padding:22px;box-shadow:8px 8px 0 #f4c430;">
    <div style="display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:18px;">
      <div>
        <div style="color:#f4c430;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;">Order reporting</div>
        <h2 style="margin:5px 0 0;font-size:24px;color:#fff;">Export exactly what you need.</h2>
      </div>
      <div style="font-size:13px;color:#bad0c2;">For selected rows, use the Excel action below.</div>
    </div>
    <form method="get" action="{{ order_export_url }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px;align-items:end;">
      <label style="display:grid;gap:6px;font-size:12px;color:#d9e5dc;">From
        <input type="date" name="date_from" style="min-height:42px;border:1px solid #527060;background:#173b2b;color:#fff;padding:8px 10px;" />
      </label>
      <label style="display:grid;gap:6px;font-size:12px;color:#d9e5dc;">To
        <input type="date" name="date_to" style="min-height:42px;border:1px solid #527060;background:#173b2b;color:#fff;padding:8px 10px;" />
      </label>
      <label style="display:grid;gap:6px;font-size:12px;color:#d9e5dc;">Order status
        <select name="status" style="min-height:42px;border:1px solid #527060;background:#173b2b;color:#fff;padding:8px 10px;">
          <option value="">All statuses</option>{% for value, label in order_status_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label style="display:grid;gap:6px;font-size:12px;color:#d9e5dc;">Payment
        <select name="payment_status" style="min-height:42px;border:1px solid #527060;background:#173b2b;color:#fff;padding:8px 10px;">
          <option value="">All payments</option>{% for value, label in payment_status_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label style="display:grid;gap:6px;font-size:12px;color:#d9e5dc;">Channel
        <select name="source" style="min-height:42px;border:1px solid #527060;background:#173b2b;color:#fff;padding:8px 10px;">
          <option value="">All channels</option>{% for value, label in order_source_choices %}<option value="{{ value }}">{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label style="display:grid;gap:6px;font-size:12px;color:#d9e5dc;">Customer or reference
        <input type="search" name="customer" placeholder="Name, email, phone…" style="min-height:42px;border:1px solid #527060;background:#173b2b;color:#fff;padding:8px 10px;" />
      </label>
      <button type="submit" style="min-height:42px;border:0;background:#f4c430;color:#0d3b2a;padding:10px 18px;font-weight:800;cursor:pointer;">Download Excel</button>
    </form>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button type="button" data-days="0" style="border:1px solid #527060;background:transparent;color:#d9e5dc;padding:6px 10px;cursor:pointer;">Today</button>
      <button type="button" data-days="7" style="border:1px solid #527060;background:transparent;color:#d9e5dc;padding:6px 10px;cursor:pointer;">Past 7 days</button>
      <button type="button" data-days="30" style="border:1px solid #527060;background:transparent;color:#d9e5dc;padding:6px 10px;cursor:pointer;">Past 30 days</button>
      <button type="button" data-days="month" style="border:1px solid #527060;background:transparent;color:#d9e5dc;padding:6px 10px;cursor:pointer;">This month</button>
    </div>
  </section>
  <script>
    document.querySelectorAll('[data-days]').forEach(function (button) {
      button.addEventListener('click', function () {
        var form = button.closest('section').querySelector('form');
        var today = new Date();
        var start = new Date(today);
        var value = button.getAttribute('data-days');
        if (value === 'month') start = new Date(today.getFullYear(), today.getMonth(), 1);
        else start.setDate(today.getDate() - Number(value));
        var local = function (date) { return date.toLocaleDateString('en-CA'); };
        form.elements.date_from.value = local(start);
        form.elements.date_to.value = local(today);
      });
    });
  </script>
  {{ block.super }}
{% endblock %}
